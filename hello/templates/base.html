<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Object Measurement API</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --ink: #17202a;
      --muted: #5d6978;
      --line: #dbe2ea;
      --panel: #ffffff;
      --teal: #0f766e;
      --teal-dark: #0b5751;
      --blue: #2457a6;
      --amber: #b7791f;
      --rose: #b42345;
      --code-bg: #101828;
      --code-ink: #edf2f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: var(--blue);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover {
      color: var(--teal-dark);
    }

    .site-header {
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
    }

    .site-header__inner,
    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .site-header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 750;
      text-decoration: none;
    }

    .brand__mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--teal);
      color: white;
      font-size: 0.88rem;
      letter-spacing: 0;
    }

    .header-link {
      color: var(--muted);
      font-size: 0.94rem;
    }

    .page {
      padding: 42px 0 56px;
    }

    .hero {
      display: grid;
      gap: 18px;
      padding: 28px 0 34px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0;
      color: var(--teal);
      font-size: 0.78rem;
      font-weight: 760;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 780px;
      margin-bottom: 0;
      font-size: clamp(2.2rem, 6vw, 4.8rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 16px;
      font-size: 1.45rem;
      letter-spacing: 0;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 1.05rem;
      letter-spacing: 0;
    }

    .hero__copy {
      max-width: 720px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .hero__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-size: 0.9rem;
      white-space: normal;
    }

    .section {
      padding: 28px 0 0;
    }

    .example-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .example-card {
      display: grid;
      gap: 12px;
      align-content: start;
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 14px 30px rgba(16, 24, 40, 0.06);
    }

    .example-card p {
      margin-bottom: 0;
      color: var(--muted);
    }

    .example-card__link {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--teal);
      color: white;
      font-weight: 720;
      text-decoration: none;
    }

    .example-card__link:hover {
      color: white;
      background: var(--teal-dark);
    }

    code,
    pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.88rem;
    }

    code {
      overflow-wrap: anywhere;
    }

    pre {
      margin: 0;
      padding: 12px;
      overflow-x: auto;
      border-radius: 8px;
      background: var(--code-bg);
      color: var(--code-ink);
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .details-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 18px;
      align-items: start;
    }

    .info-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
    }

    .info-list li + li {
      margin-top: 8px;
    }

    .debug-swatch {
      display: grid;
      gap: 10px;
      padding: 18px;
      border-left: 4px solid var(--amber);
      border-radius: 8px;
      background: var(--panel);
    }

    .debug-swatch p {
      margin-bottom: 0;
      color: var(--muted);
    }

    .sample-image-url {
      color: var(--rose);
    }

    @media (max-width: 760px) {
      .site-header__inner {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding: 14px 0;
      }

      .page {
        padding-top: 24px;
      }

      .example-grid,
      .details-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/">
        <span class="brand__mark">mm</span>
        <span>Object Measurement API</span>
      </a>
      <a class="header-link" href="https://github.com/justingeeslin/Real-Time-Object-Measurement">Measurement engine</a>
    </div>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
